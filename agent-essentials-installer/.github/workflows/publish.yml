name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          scope: '@anedezorchestrator'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (optional)
        run: npm run lint || true
        continue-on-error: true

      - name: Publish to npm
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Published to npm as `@anedezorchestrator/orchestrator-essentials-setup@${{ github.ref }}`
            
            Install with:
            ```bash
            npm install -g @anedezorchestrator/orchestrator-essentials-setup
            # or
            npx @anedezorchestrator/orchestrator-essentials-setup
            ```
          draft: false
          prerelease: false
